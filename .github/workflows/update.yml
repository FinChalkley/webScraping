name: Update table
on:
  schedule:
    - cron: "0 8,12,17,21 * * *"   # 4 times a day (UTC)
  workflow_dispatch:                # lets you run it manually too

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4
      - run: python test.py
      - name: Commit if changed
        run: |
          git config user.name "table-bot"
          git config user.email "table-bot@users.noreply.github.com"
          git add division2.json
          git diff --cached --quiet || (git commit -m "Update table" && git push)